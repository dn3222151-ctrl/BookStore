<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh Sửa Sách - BookStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .preview-img { width: 100px; height: 140px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold text-dark mb-0">
                        <i class="bi bi-pencil-square text-primary me-2"></i> Chỉnh Sửa Sách #<span th:text="${editBook.id}">1</span>
                    </h4>
                    <a th:href="@{/books/hienthi}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại</a>
                </div>

                <form th:action="@{/books/update}" th:object="${editBook}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label fw-bold">Tên sách *</label>
                            <input type="text" th:field="*{title}" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Thể loại *</label>
                            <select th:field="*{categoryId}" class="form-select" required>
                                <option value="0">-- Chọn thể loại --</option>
                                <option th:each="cat : ${listcategories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tác giả</label>
                            <input type="text" th:field="*{author}" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Giá bán (VNĐ) *</label>
                            <input type="number" th:field="*{price}" class="form-control" min="0" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Số lượng kho *</label>
                            <input type="number" th:field="*{quantity}" class="form-control" min="0" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">URL Hình ảnh bìa sách</label>
                            <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://...">
                        </div>

                        <div class="col-12" th:if="${editBook.imageUrl != null and !editBook.imageUrl.isEmpty()}">
                            <label class="form-label fw-bold text-secondary">Ảnh hiện tại:</label><br>
                            <img th:src="${editBook.imageUrl}" class="preview-img border shadow-sm" alt="Cover Preview"
                                 onerror="this.src='https://via.placeholder.com/100x140?text=Error'">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Mô tả nội dung</label>
                            <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
                        </div>

                        <div class="col-12 mt-4 text-end">
                            <a th:href="@{/books/hienthi}" class="btn btn-light me-2">Hủy</a>
                            <button type="submit" class="btn btn-primary px-4 fw-bold"><i class="bi bi-check-lg me-1"></i> Cập Nhật</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
