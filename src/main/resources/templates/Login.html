<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        /* Chỉ 2 dòng CSS tùy chỉnh */
        body { font-size: 14px; background-color: #f8f9fa; }
        .login-card { width: 420px; max-width: 100%; }
    </style>
</head>
<body>

<div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card login-card p-4">

        <!-- Tiêu đề -->
        <div class="text-center mb-4">
            <div class="fs-3 mb-2"><i class="bi bi-book-half"></i></div>
            <h5 class="fw-semibold mb-1">Đăng nhập BookStore</h5>
            <p class="small text-muted mb-0">Chào mừng bạn quay trở lại</p>
        </div>

        <!-- Thông báo lỗi hoặc thành công -->
        <div th:if="${error != null}" class="alert alert-danger py-2 px-3 small" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
        </div>
        <div th:if="${message != null}" class="alert alert-success py-2 px-3 small" role="alert">
            <i class="bi bi-check-circle me-1"></i> <span th:text="${message}"></span>
        </div>

        <form th:action="@{/login}" th:object="${loginRequest}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small text-muted">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" th:field="*{username}" class="form-control"
                           placeholder="admin hoặc khachhang" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label small text-muted">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           placeholder="Nhập mật khẩu" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="remember" th:field="*{remember}">
                    <label class="form-check-label small text-muted" for="remember">Ghi nhớ</label>
                </div>
                <a th:href="@{/shop}" class="small text-decoration-none text-muted">
                    <i class="bi bi-arrow-left"></i> Xem sách trước
                </a>
            </div>

            <button type="submit" class="btn btn-dark w-100">Đăng nhập</button>
        </form>

        <div class="text-center small text-muted mt-3">
            Chưa có tài khoản?
            <a th:href="@{/register}" class="fw-semibold text-dark text-decoration-none">Đăng ký</a>
        </div>
    </div>
</div>

</body>
</html>
