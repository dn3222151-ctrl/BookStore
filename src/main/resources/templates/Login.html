<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
        }
        .login-card {
            display: flex;
            width: 900px;
            max-width: 100%;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        }
        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            color: #ffffff;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        .login-left .brand-icon {
            font-size: 56px;
            margin-bottom: 20px;
        }
        .login-left h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .login-left p {
            font-size: 15px;
            opacity: 0.9;
            line-height: 1.7;
            margin-bottom: 25px;
        }
        .account-hint {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 12px;
            font-size: 13px;
        }
        .account-hint code {
            color: #ffeaa7;
            font-weight: 600;
        }
        .login-right {
            flex: 1.1;
            padding: 50px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-right h2 {
            font-size: 26px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 8px;
        }
        .login-right .subtitle {
            color: #718096;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn-custom {
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            color: white;
            border: none;
            padding: 13px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .btn-custom:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(43, 88, 118, 0.3);
            color: white;
        }
        @media (max-width: 768px) {
            .login-left { display: none; }
            .login-right { padding: 35px 25px; }
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- Cột trái giới thiệu -->
    <div class="login-left">
        <div class="brand-icon"><i class="bi bi-book-half"></i> BookStore</div>
        <h1>Thế Giới Tri Thức</h1>


    </div>

    <!-- Cột phải form đăng nhập -->
    <div class="login-right">
        <h2>Đăng Nhập</h2>
        <p class="subtitle">Chào mừng bạn quay trở lại! Vui lòng đăng nhập tài khoản.</p>

        <!-- Thông báo lỗi hoặc thành công -->
        <div th:if="${error != null}" class="alert alert-danger py-2 px-3 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
        </div>
        <div th:if="${message != null}" class="alert alert-success py-2 px-3 small" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${message}"></span>
        </div>

        <form th:action="@{/login}" th:object="${loginRequest}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small fw-bold text-secondary">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="Nhập username (admin hoặc khachhang)" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label small fw-bold text-secondary">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Nhập mật khẩu" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="remember" th:field="*{remember}">
                    <label class="form-check-label small text-secondary" for="remember">Ghi nhớ đăng nhập</label>
                </div>
                <a th:href="@{/shop}" class="small text-decoration-none text-primary"><i class="bi bi-arrow-left"></i> Xem sách trước</a>
            </div>

            <button type="submit" class="btn btn-custom w-100 mb-3">ĐĂNG NHẬP NGAY</button>
        </form>

        <div class="text-center small text-secondary mt-2">
            Chưa có tài khoản? <a th:href="@{/register}" class="fw-bold text-primary text-decoration-none">Đăng ký thành viên</a>
        </div>
    </div>
</div>

</body>
</html>
