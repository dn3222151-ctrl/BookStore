<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Đơn Hàng - BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        /* Chỉ 2 dòng CSS tùy chỉnh */
        body { font-size: 14px; background-color: #f8f9fa; }
        .book-img-thumb { width: 45px; height: 60px; object-fit: cover; }
    </style>
</head>
<body>

<!-- Navbar: nền trắng, viền dưới mảnh -->
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand fw-semibold text-dark" th:href="@{/shop}">
            <i class="bi bi-book-half me-1"></i> BookStore
        </a>
        <a th:href="@{/shop/cart}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Quay lại giỏ hàng
        </a>
    </div>
</nav>

<div class="container py-4">
    <h4 class="fw-semibold mb-4">Thông tin giao hàng & thanh toán</h4>

    <div class="row g-4">
        <!-- Form Thông tin người nhận -->
        <div class="col-lg-7">
            <div class="card p-4">
                <h6 class="fw-semibold border-bottom pb-2 mb-3">Địa chỉ nhận hàng</h6>

                <form th:action="@{/shop/checkout}" method="post">
                    <div class="mb-3">
                        <label class="form-label small text-muted">Họ và tên người nhận *</label>
                        <input type="text" name="fullName" class="form-control"
                               th:value="${currentUser != null ? currentUser.fullName : ''}"
                               placeholder="Nguyễn Văn A" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-muted">Số điện thoại liên hệ *</label>
                        <input type="tel" name="phone" class="form-control" placeholder="0987654321" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-muted">Địa chỉ giao hàng chi tiết *</label>
                        <textarea name="address" rows="3" class="form-control"
                                  placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành phố" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-muted">Ghi chú giao hàng (nếu có)</label>
                        <input type="text" name="notes" class="form-control" placeholder="Ví dụ: Giao vào giờ hành chính...">
                    </div>

                    <div class="border rounded p-3 mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="cod" checked>
                            <label class="form-check-label" for="cod">
                                <span class="fw-semibold">Thanh toán khi nhận hàng (COD)</span>
                            </label>
                            <div class="small text-muted mt-1">Thanh toán bằng tiền mặt trực tiếp cho nhân viên giao hàng khi nhận sách.</div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100">
                        <i class="bi bi-check2-circle me-1"></i> Xác nhận đặt hàng
                    </button>
                </form>
            </div>
        </div>

        <!-- Tóm tắt sản phẩm mua -->
        <div class="col-lg-5">
            <div class="card p-4">
                <h6 class="fw-semibold border-bottom pb-2 mb-3">
                    Sách đặt mua (<span th:text="${cartItems.size()}">0</span>)
                </h6>

                <div class="mb-3" style="max-height: 320px; overflow-y: auto;">
                    <div th:each="item : ${cartItems}" class="d-flex align-items-center justify-content-between py-2 border-bottom">
                        <div class="d-flex align-items-center gap-2">
                            <img th:src="${item.book.imageUrl != null ? item.book.imageUrl : 'https://via.placeholder.com/45x60'}"
                                 class="book-img-thumb border" alt="Cover"
                                 onerror="this.src='https://via.placeholder.com/45x60?text=No+Cover'">
                            <div>
                                <div class="small fw-semibold text-truncate" style="max-width: 180px;" th:text="${item.book.title}">Tên sách</div>
                                <div class="small text-muted">
                                    SL: <span th:text="${item.quantity}">1</span> ×
                                    <span th:text="${#numbers.formatDecimal(item.book.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">100.000 đ</span>
                                </div>
                            </div>
                        </div>
                        <div class="small fw-semibold"
                             th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' đ'">100.000 đ</div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Tạm tính</span>
                    <strong th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">200.000 đ</strong>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span class="text-muted">Phí vận chuyển</span>
                    <span class="fw-semibold">Miễn phí</span>
                </div>

                <div class="border-top pt-3">
                    <div class="d-flex justify-content-between align-items-baseline">
                        <span class="fw-semibold">Tổng thanh toán</span>
                        <span class="fs-5 fw-semibold text-danger"
                              th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">200.000 đ</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
