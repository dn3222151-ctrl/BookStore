<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
        }
        .register-card {
            width: 520px;
            max-width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        }
        .btn-custom {
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
        }
        .btn-custom:hover {
            opacity: 0.95;
            color: white;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-dark"><i class="bi bi-person-plus-fill text-primary"></i> Đăng Ký Tài Khoản</h3>
        <p class="text-secondary small">Trở thành thành viên BookStore để mua sách và nhận ưu đãi!</p>
    </div>

    <div th:if="${error != null}" class="alert alert-danger py-2 px-3 small" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
    </div>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Tên đăng nhập *</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" th:field="*{username}" class="form-control" placeholder="Tên đăng nhập viết liền không dấu" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Họ và tên *</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-card-text"></i></span>
                <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nguyễn Văn A" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Email</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" th:field="*{email}" class="form-control" placeholder="vidu@gmail.com">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Mật khẩu *</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" th:field="*{password}" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-bold text-secondary">Xác nhận mật khẩu *</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu" required>
            </div>
        </div>

        <button type="submit" class="btn btn-custom w-100 mb-3">TẠO TÀI KHOẢN</button>
    </form>

    <div class="text-center small text-secondary">
        Đã có tài khoản? <a th:href="@{/login}" class="fw-bold text-primary text-decoration-none">Đăng nhập ngay</a>
    </div>
</div>

</body>
</html>
