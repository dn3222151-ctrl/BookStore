<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        /* Chỉ 2 dòng CSS tùy chỉnh */
        body { font-size: 14px; background-color: #f8f9fa; }
        .register-card { width: 460px; max-width: 100%; }
    </style>
</head>
<body>

<div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card register-card p-4">

        <!-- Tiêu đề -->
        <div class="text-center mb-4">
            <div class="fs-3 mb-2"><i class="bi bi-book-half"></i></div>
            <h5 class="fw-semibold mb-1">Đăng ký tài khoản</h5>
            <p class="small text-muted mb-0">Trở thành thành viên BookStore</p>
        </div>

        <!-- Thông báo lỗi -->
        <div th:if="${error != null}" class="alert alert-danger py-2 px-3 small" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <div class="mb-3">
                <label class="form-label small text-muted">Tên đăng nhập *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" th:field="*{username}" class="form-control"
                           placeholder="Tên đăng nhập viết liền không dấu" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small text-muted">Họ và tên *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                    <input type="text" th:field="*{fullName}" class="form-control"
                           placeholder="Nguyễn Văn A" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small text-muted">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" th:field="*{email}" class="form-control"
                           placeholder="vidu@gmail.com">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small text-muted">Mật khẩu *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" th:field="*{password}" class="form-control"
                           placeholder="Nhập mật khẩu" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small text-muted">Xác nhận mật khẩu *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                    <input type="password" th:field="*{confirmPassword}" class="form-control"
                           placeholder="Nhập lại mật khẩu" required>
                </div>
            </div>

            <button type="submit" class="btn btn-dark w-100">Tạo tài khoản</button>
        </form>

        <div class="text-center small text-muted mt-3">
            Đã có tài khoản?
            <a th:href="@{/login}" class="fw-semibold text-dark text-decoration-none">Đăng nhập</a>
        </div>
    </div>
</div>

</body>
</html>
