<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.title} + ' - BookStore'">Chi Tiết Sách - BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        /* Chỉ 2 dòng CSS tùy chỉnh */
        body { font-size: 14px; background-color: #f8f9fa; }
        .detail-img { max-height: 420px; width: 100%; object-fit: cover; }
    </style>
</head>
<body>

<!-- Navbar: nền trắng, viền dưới mảnh -->
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand fw-semibold text-dark" th:href="@{/shop}">
            <i class="bi bi-book-half me-1"></i> BookStore
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/shop}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Quay lại
            </a>
            <a th:href="@{/shop/cart}" class="btn btn-outline-secondary btn-sm position-relative">
                <i class="bi bi-cart3 me-1"></i> Giỏ hàng
                <span th:if="${cartCount > 0}" class="badge bg-dark rounded-pill" th:text="${cartCount}">0</span>
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- Flash Messages -->
    <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Chi tiết sách -->
    <div class="card p-4 mb-4">
        <div class="row g-4 align-items-start">
            <div class="col-md-4 text-center">
                <img th:src="${book.imageUrl != null and !book.imageUrl.isEmpty() ? book.imageUrl : 'https://via.placeholder.com/350x450'}"
                     class="detail-img border" alt="Cover"
                     onerror="this.src='https://via.placeholder.com/350x450?text=No+Cover'">
            </div>

            <div class="col-md-8">
                <span class="badge border text-dark fw-normal mb-2"
                      th:text="${book.categories != null ? book.categories.name : 'Khác'}">IT</span>

                <h3 class="fw-semibold mb-2" th:text="${book.title}">Tiêu đề cuốn sách</h3>
                <p class="text-muted mb-3">Tác giả: <strong class="text-dark" th:text="${book.author != null ? book.author : 'Chưa rõ'}">Tác giả</strong></p>

                <div class="border rounded p-3 mb-3">
                    <div class="d-flex align-items-center gap-3">
                        <span class="fs-4 fw-semibold text-danger"
                              th:text="${#numbers.formatDecimal(book.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">150.000 đ</span>
                        <span class="badge border text-dark fw-normal" th:if="${book.quantity > 0}">
                            Còn <span th:text="${book.quantity}">50</span> cuốn
                        </span>
                        <span class="badge border text-dark fw-normal" th:if="${book.quantity <= 0}">Hết hàng</span>
                    </div>
                </div>

                <div class="mb-3">
                    <h6 class="fw-semibold mb-2">Giới thiệu sách</h6>
                    <p class="text-muted mb-0" th:text="${book.description != null and !book.description.isEmpty() ? book.description : 'Cuốn sách đang cập nhật mô tả nội dung...'}">
                        Mô tả chi tiết nội dung cuốn sách...
                    </p>
                </div>

                <!-- Form Thêm vào giỏ -->
                <form th:if="${book.quantity > 0}" th:action="@{/shop/cart/add}" method="post" class="d-flex gap-3 align-items-end">
                    <input type="hidden" name="bookId" th:value="${book.id}">
                    <div style="width: 110px;">
                        <label class="form-label small text-muted mb-1">Số lượng</label>
                        <input type="number" name="quantity" value="1" min="1" th:max="${book.quantity}" class="form-control text-center">
                    </div>
                    <button type="submit" class="btn btn-dark">
                        <i class="bi bi-cart-plus me-1"></i> Thêm vào giỏ
                    </button>
                </form>

                <div th:if="${book.quantity <= 0}" class="alert alert-warning mb-0">
                    <i class="bi bi-info-circle me-1"></i> Sản phẩm hiện đang tạm hết hàng.
                </div>
            </div>
        </div>
    </div>

    <!-- Sách cùng thể loại -->
    <div th:if="${not #lists.isEmpty(relatedBooks)}">
        <h5 class="fw-semibold mb-3">Sách cùng thể loại</h5>
        <div class="row g-3">
            <div th:each="rel : ${relatedBooks}" class="col-6 col-md-3">
                <div class="card h-100 p-3 text-center">
                    <img th:src="${rel.imageUrl != null ? rel.imageUrl : 'https://via.placeholder.com/150x200'}"
                         class="mb-2 border" style="height: 180px; object-fit: cover;" alt="Cover"
                         onerror="this.src='https://via.placeholder.com/150x200?text=No+Cover'">
                    <div class="fw-semibold text-truncate" th:text="${rel.title}">Tiêu đề</div>
                    <div class="text-danger small mb-2" th:text="${#numbers.formatDecimal(rel.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">50.000 đ</div>
                    <a th:href="@{/shop/book/{id}(id=${rel.id})}" class="btn btn-outline-secondary btn-sm mt-auto">Xem sách</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
