<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sách - BookStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        /* Chỉ 3 dòng CSS tùy chỉnh */
        body { font-size: 14px; background-color: #f8f9fa; }
        .table > :not(caption) > * > * { vertical-align: middle; }
        .book-img-thumb { width: 50px; height: 70px; object-fit: cover; }
    </style>
</head>
<body>

<!-- Navbar: nền trắng, viền dưới mảnh -->
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-semibold text-dark" th:href="@{/books/hienthi}">
            <i class="bi bi-book-half me-1"></i> BookStore Admin
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active fw-semibold text-dark" th:href="@{/books/hienthi}">
                        <i class="bi bi-journal-text me-1"></i> Quản lý Sách
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" th:href="@{/admin/orders}">
                        <i class="bi bi-receipt-cutoff me-1"></i> Quản lý Đơn Hàng
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" th:href="@{/shop}" target="_blank">
                        <i class="bi bi-shop me-1"></i> Xem Website <i class="bi bi-box-arrow-up-right small"></i>
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="me-3 small text-muted">
                    <i class="bi bi-person-circle me-1"></i>
                    <strong th:text="${currentUser != null ? currentUser.fullName : 'Admin'}">Admin</strong>
                </span>
                <a th:href="@{/logout}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
                </a>
            </div>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 py-4">

    <!-- Flash Messages -->
    <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Header & Tools -->
    <div class="card mb-4 p-3">
        <div class="row g-3 align-items-center">
            <div class="col-md-3">
                <h5 class="mb-0 fw-semibold">Danh sách sách</h5>
                <small class="text-muted">Tổng cộng: <strong th:text="${listBook.size()}">0</strong> cuốn</small>
            </div>
            <div class="col-md-6">
                <form th:action="@{/books/hienthi}" method="get" class="d-flex gap-2">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tiêu đề...">
                    <select name="categoryId" class="form-select" style="max-width: 200px;">
                        <option value="">-- Tất cả thể loại --</option>
                        <option th:each="cat : ${listcategories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${selectedCategory == cat.id}">
                        </option>
                    </select>
                    <button type="submit" class="btn btn-outline-secondary px-3"><i class="bi bi-search"></i></button>
                    <a th:if="${keyword != null or selectedCategory != null}" th:href="@{/books/hienthi}" class="btn btn-outline-secondary">Xóa</a>
                </form>
            </div>
            <div class="col-md-3 text-md-end">
                <button type="button" class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#addBookModal">
                    <i class="bi bi-plus-lg me-1"></i> Thêm sách
                </button>
            </div>
        </div>
    </div>

    <!-- Bảng Sách -->
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width: 60px;">ID</th>
                    <th style="width: 80px;">Ảnh bìa</th>
                    <th>Tên sách</th>
                    <th>Tác giả</th>
                    <th>Thể loại</th>
                    <th>Giá bán</th>
                    <th>Tồn kho</th>
                    <th>Mô tả</th>
                    <th style="width: 140px;" class="text-center">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${listBook.empty}">
                    <td colspan="9" class="text-center py-4 text-muted">
                        <i class="bi bi-inbox fs-2 d-block mb-2"></i> Chưa có dữ liệu sách nào!
                    </td>
                </tr>
                <tr th:each="book : ${listBook}">
                    <td class="fw-semibold" th:text="${book.id}">1</td>
                    <td>
                        <img th:src="${book.imageUrl != null and !book.imageUrl.isEmpty() ? book.imageUrl : 'https://via.placeholder.com/50x70?text=Book'}"
                             class="book-img-thumb border" alt="Cover"
                             onerror="this.src='https://via.placeholder.com/50x70?text=No+Cover'">
                    </td>
                    <td>
                        <span class="fw-semibold" th:text="${book.title}">Tiêu đề sách</span>
                    </td>
                    <td th:text="${book.author != null ? book.author : 'Chưa rõ'}">Tác giả</td>
                    <td>
                        <span class="badge border text-dark fw-normal" th:text="${book.categoryName != null ? book.categoryName : 'Chưa phân loại'}">IT</span>
                    </td>
                    <td class="fw-semibold">
                        <span th:text="${#numbers.formatDecimal(book.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">100.000 đ</span>
                    </td>
                    <td>
                        <span th:if="${book.quantity > 10}" class="badge border text-dark fw-normal" th:text="${book.quantity} + ' cuốn'">50</span>
                        <span th:if="${book.quantity <= 10 and book.quantity > 0}" class="badge border text-dark fw-normal" th:text="'Sắp hết: ' + ${book.quantity}">5</span>
                        <span th:if="${book.quantity <= 0}" class="badge border text-dark fw-normal">Hết hàng</span>
                    </td>
                    <td>
                        <small class="text-muted" th:text="${#strings.abbreviate(book.description != null ? book.description : '', 60)}">Mô tả ngắn...</small>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-outline-secondary btn-sm me-1" title="Chỉnh sửa">
                            <i class="bi bi-pencil-square"></i>
                        </a>
                        <a th:href="@{/books/delete/{id}(id=${book.id})}"
                           class="btn btn-outline-danger btn-sm"
                           title="Xóa sách"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa cuốn sách này không?');">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Thêm Sách Nhanh -->
<div class="modal fade" id="addBookModal" tabindex="-1" aria-labelledby="addBookModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form th:action="@{/books/add}" th:object="${newBook}" method="post">
                <div class="modal-header border-bottom">
                    <h6 class="modal-title fw-semibold" id="addBookModalLabel">Thêm sách mới</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label small text-muted">Tên sách *</label>
                            <input type="text" th:field="*{title}" class="form-control" placeholder="Nhập tiêu đề sách" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small text-muted">Thể loại *</label>
                            <select th:field="*{categoryId}" class="form-select" required>
                                <option value="0">-- Chọn thể loại --</option>
                                <option th:each="cat : ${listcategories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small text-muted">Tác giả</label>
                            <input type="text" th:field="*{author}" class="form-control" placeholder="Tên tác giả">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small text-muted">Giá bán (VNĐ) *</label>
                            <input type="number" th:field="*{price}" class="form-control" placeholder="50000" min="0" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small text-muted">Số lượng kho *</label>
                            <input type="number" th:field="*{quantity}" class="form-control" placeholder="10" min="0" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label small text-muted">URL Hình ảnh bìa sách</label>
                            <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://example.com/image.jpg">
                        </div>

                        <div class="col-12">
                            <label class="form-label small text-muted">Mô tả nội dung sách</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Nhập tóm tắt nội dung sách..."></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-top">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
                    <button type="submit" class="btn btn-dark"><i class="bi bi-save me-1"></i> Lưu sách</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
