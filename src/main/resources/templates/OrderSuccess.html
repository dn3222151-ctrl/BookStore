<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Hàng Thành Công - BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 20px; box-shadow: 0 4px 25px rgba(0,0,0,0.06); }
        .success-icon { font-size: 75px; color: #2ecc71; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card p-5 text-center">
                <div class="success-icon mb-3">
                    <i class="bi bi-check-circle-fill"></i>
                </div>
                <h2 class="fw-bold text-dark mb-2">ĐẶT HÀNG THÀNH CÔNG!</h2>
                <p class="text-secondary mb-4">
                    Cảm ơn bạn đã mua sách tại <strong>BookStore</strong>. Đơn hàng của bạn đã được lưu vào hệ thống và đang được xử lý.
                </p>

                <div class="p-4 bg-light rounded-4 text-start mb-4">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Mã đơn hàng:</span>
                        <strong class="text-primary fs-5" th:text="'#' + ${order.id}">#1</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Ngày đặt:</span>
                        <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">25/11/2026 15:30</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Trạng thái:</span>
                        <span class="badge bg-warning text-dark" th:text="${order.status}">PENDING</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Địa chỉ nhận hàng:</span>
                        <span class="text-end fw-semibold" style="max-width: 320px;" th:text="${order.shippingAddress}">Địa chỉ</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between align-items-baseline">
                        <span class="fw-bold text-dark fs-5">Tổng tiền thanh toán:</span>
                        <span class="fs-4 fw-bold text-danger" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">200.000 đ</span>
                    </div>
                </div>

                <div class="d-flex gap-3 justify-content-center">
                    <a th:href="@{/shop}" class="btn btn-primary rounded-pill px-4 py-2 fw-bold">
                        <i class="bi bi-book me-1"></i> Tiếp tục mua sách
                    </a>
                    <a th:href="@{/shop/my-orders}" class="btn btn-outline-secondary rounded-pill px-4 py-2">
                        <i class="bi bi-receipt me-1"></i> Xem đơn hàng của tôi
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
