<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn Hàng Của Tôi - BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        /* Chỉ 2 dòng CSS tùy chỉnh */
        body { font-size: 14px; background-color: #f8f9fa; }
        .book-img-thumb { width: 45px; height: 60px; object-fit: cover; }
    </style>
</head>
<body>

<!-- Navbar: nền trắng, viền dưới mảnh -->
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand fw-semibold text-dark" th:href="@{/shop}">
            <i class="bi bi-book-half me-1"></i> BookStore
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/shop}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Về cửa hàng
            </a>
            <a th:href="@{/logout}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-box-arrow-right"></i> Đăng xuất
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h4 class="fw-semibold mb-4">Lịch sử đơn hàng của bạn</h4>

    <!-- Không có đơn hàng -->
    <div th:if="${orders.empty}" class="card p-5 text-center">
        <i class="bi bi-inbox fs-1 text-muted d-block mb-3"></i>
        <h6 class="text-secondary mb-2">Bạn chưa có đơn hàng nào</h6>
        <p class="text-muted mb-3">Hãy đặt mua những cuốn sách bạn yêu thích.</p>
        <div>
            <a th:href="@{/shop}" class="btn btn-dark">Mua sách</a>
        </div>
    </div>

    <!-- Danh sách đơn hàng -->
    <div th:if="${not orders.empty}">
        <div th:each="order : ${orders}" class="card p-4 mb-3">
            <div class="d-flex flex-wrap justify-content-between align-items-center border-bottom pb-2 mb-3">
                <div>
                    <span class="fw-semibold" th:text="'Đơn hàng #' + ${order.id}">#1</span>
                    <small class="text-muted ms-2" th:text="'Ngày đặt: ' + ${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">25/11/2026</small>
                </div>
                <div>
                    <span th:if="${order.status == 'PENDING'}" class="badge border text-dark fw-normal">Chờ xác nhận</span>
                    <span th:if="${order.status == 'CONFIRMED'}" class="badge border text-dark fw-normal">Đã xác nhận</span>
                    <span th:if="${order.status == 'SHIPPING'}" class="badge border text-dark fw-normal">Đang giao hàng</span>
                    <span th:if="${order.status == 'COMPLETED'}" class="badge border text-dark fw-normal">Đã hoàn thành</span>
                    <span th:if="${order.status == 'CANCELLED'}" class="badge border text-dark fw-normal">Đã hủy</span>
                </div>
            </div>

            <!-- Danh sách sách trong đơn -->
            <div class="mb-3">
                <div th:each="detail : ${order.orderDetails}" class="d-flex align-items-center justify-content-between py-2 border-bottom">
                    <div class="d-flex align-items-center gap-3">
                        <img th:src="${detail.book != null and detail.book.imageUrl != null ? detail.book.imageUrl : 'https://via.placeholder.com/45x60'}"
                             class="book-img-thumb border" alt="Book"
                             onerror="this.src='https://via.placeholder.com/45x60?text=No+Cover'">
                        <div>
                            <span class="fw-semibold" th:text="${detail.book != null ? detail.book.title : 'Sách đã xóa'}">Tên sách</span>
                            <div class="small text-muted">Số lượng: <strong th:text="${detail.quantity}">1</strong> cuốn</div>
                        </div>
                    </div>
                    <div class="text-end small fw-semibold"
                         th:text="${#numbers.formatDecimal(detail.price * detail.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">100.000 đ</div>
                </div>
            </div>

            <div class="d-flex flex-wrap justify-content-between align-items-center">
                <div>
                    <small class="text-muted">
                        <i class="bi bi-geo-alt"></i> Giao đến: <span th:text="${order.shippingAddress}">Địa chỉ</span>
                    </small>
                </div>
                <div>
                    <span class="text-muted small me-2">Tổng tiền</span>
                    <span class="fw-semibold text-danger"
                          th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">200.000 đ</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
