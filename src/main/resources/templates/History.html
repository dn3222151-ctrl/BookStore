<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử đã xem - BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('bookstore-theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
    <style>
        body { font-size: 14px; }
        .book-img-wrapper { height: 200px; background: var(--bs-tertiary-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .book-img-wrapper img { max-height: 100%; max-width: 100%; object-fit: cover; }
    </style>
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg bg-body border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/shop}">
            <i class="bi bi-book-half me-1"></i> BookStore
        </a>
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/shop}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Về trang chủ</a>
            <a th:href="@{/account}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-person-circle me-1"></i> Tài khoản</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h5 class="fw-semibold mb-0"><i class="bi bi-clock-history me-2"></i>Lịch sử sách đã xem</h5>
            <small class="text-body-secondary">Hiển thị tối đa 10 đầu sách mỗi trang</small>
        </div>
        <span class="badge bg-secondary" th:text="'Tổng: ' + ${historyPage.totalElements} + ' cuốn'">Tổng: 0 cuốn</span>
    </div>

    <div th:if="${historyPage.empty}" class="text-center py-5 bg-body border rounded">
        <i class="bi bi-journal-x fs-1 text-body-secondary d-block mb-2"></i>
        <p class="text-body-secondary mb-3">Bạn chưa xem cuốn sách nào.</p>
        <a th:href="@{/shop}" class="btn btn-dark btn-sm">Khám phá sách ngay</a>
    </div>

    <div th:if="${!historyPage.empty}" class="row row-cols-2 row-cols-md-5 g-3">
        <div th:each="item : ${historyPage.content}" class="col">
            <div class="card h-100">
                <a th:href="@{/shop/book/{id}(id=${item.book.id})}" class="book-img-wrapper border-bottom">
                    <img th:src="${item.book.imageUrl != null and !item.book.imageUrl.isEmpty() ? item.book.imageUrl : ''}"
                         referrerpolicy="no-referrer"
                         alt="Cover"
                         onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22260%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23dee2e6%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%236c757d%22 font-family=%22sans-serif%22 font-size=%2214%22%3ECh%C6%B0a c%C3%B3 b%C3%ACa%3C/text%3E%3C/svg%3E';">
                </a>
                <div class="card-body p-2 d-flex flex-column">
                    <a th:href="@{/shop/book/{id}(id=${item.book.id})}"
                       class="fw-semibold text-truncate text-decoration-none text-body mb-1"
                       th:title="${item.book.title}"
                       th:text="${item.book.title}">Tên sách</a>
                    <small class="text-body-secondary mt-auto"
                           th:text="'Xem lúc: ' + ${#temporals.format(item.viewedAt, 'dd/MM HH:mm')}">Xem lúc</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Thanh chia tab trang (Trang 1, Trang 2, ...) -->
    <nav th:if="${totalPages > 1}" class="mt-4">
        <ul class="pagination pagination-sm justify-content-center">
            <li class="page-item" th:classappend="${currentPage <= 1 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/shop/history(page=${currentPage - 1})}">Trước</a>
            </li>
            <li th:each="i : ${#numbers.sequence(1, totalPages)}"
                class="page-item"
                th:classappend="${i == currentPage ? 'active' : ''}">
                <a class="page-link" th:href="@{/shop/history(page=${i})}" th:text="'Trang ' + ${i}">Trang 1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage >= totalPages ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/shop/history(page=${currentPage + 1})}">Sau</a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
